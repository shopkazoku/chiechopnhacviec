<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Chiếc Hộp Nhắc Việc - Task Box Marki</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    /* CSS giữ nguyên tone pastel của Boss và bổ sung hiển thị Bảng màu + Lịch tháng */
    :root { --primary: #F2C1D1; --primary-dark: #DFA2B6; --bg: #FAF5F7; }
    body { background: var(--bg); font-family: 'Quicksand', sans-serif; padding: 20px; }
    .card { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: inline-block; border: 2px solid transparent; }
    .color-swatch.active { border-color: #333; }
    .form-group { margin-bottom: 15px; }
    .input-box { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
    .btn-add { background: var(--primary); border: none; padding: 10px; width: 100%; border-radius: 10px; color: #fff; font-weight: 700; cursor: pointer; }
    .calendar-wrapper { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-day { height: 60px; border: 1px solid #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Hiển thị lịch tháng trên đầu -->
    <div class="card">
      <h2 id="monthTitle">Tháng 8 / 2026</h2>
      <div class="calendar-wrapper" id="calendarBody"></div>
    </div>

    <!-- Nhắc việc -->
    <div class="card">
      <h3>Nhắc Việc</h3>
      <input type="text" id="taskTitle" class="input-box" placeholder="Tên công việc...">
      
      <!-- Bảng màu Label -->
      <div id="palette" style="margin: 10px 0;"></div>
      
      <select id="repeatType" class="input-box" onchange="updateRepeatOptions()">
        <option value="daily">Hàng ngày</option>
        <option value="weekly">Hàng tuần</option>
        <option value="monthly">Hàng tháng</option>
      </select>

      <!-- Tùy chọn hàng tuần -->
      <div id="weeklyOpt" style="display:none; margin: 10px 0;">
        <label><input type="checkbox" value="1"> T2</label>
        <label><input type="checkbox" value="2"> T3</label>
        <!-- ... -->
      </div>
      
      <button class="btn-add" onclick="saveTask()">Lưu công việc</button>
    </div>
  </div>

  <script>
    // Logic Bảng màu
    const colors = ["#F2C1D1", "#FFD3B6", "#D4F0F0", "#CCE2CB"];
    let selectedColor = colors[0];
    const palette = document.getElementById('palette');
    colors.forEach(c => {
      const el = document.createElement('div');
      el.className = 'color-swatch' + (c === selectedColor ? ' active' : '');
      el.style.backgroundColor = c;
      el.onclick = () => { selectedColor = c; renderPalette(); };
      palette.appendChild(el);
    });

    function renderPalette() {
      document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
      // ... logic active
    }

    // Logic Lịch hàng tuần/tháng
    function updateRepeatOptions() {
      const type = document.getElementById('repeatType').value;
      document.getElementById('weeklyOpt').style.display = type === 'weekly' ? 'block' : 'none';
    }

    function saveTask() { alert("Công việc đã được lưu với màu sắc và lịch trình chuẩn!"); }
  </script>
</body>
</html>
