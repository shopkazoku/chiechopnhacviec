<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chiếc Hộp Nhắc Việc - Task Box Marki</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#F2C1D1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* CSS Giữ nguyên tone Pastel của Boss */
    :root { --primary: #F2C1D1; --primary-dark: #DFA2B6; --bg-color: #FAF5F7; --text-main: #4A3E45; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Quicksand', sans-serif; padding-bottom: 30px; }
    .container { max-width: 1280px; margin: 25px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .input-box { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 10px; }
    .btn-add { background: var(--primary); border: none; padding: 12px; width: 100%; border-radius: 10px; color: #fff; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-add:hover { background: var(--primary-dark); }
    .color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: inline-block; margin-right: 5px; border: 2px solid transparent; }
    .color-swatch.active { border-color: #333; }
    .task-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 id="txtDateTitle">⏰ <span id="currentDateDisplay">Hôm nay</span></h2>
      <div id="lunarInfo" class="lunar-detail-box"></div>
      <div class="cal-grid" id="calGridBody"></div>
    </div>

    <div class="card">
      <h3>Nhắc Việc</h3>
      <!-- 1. Label màu sắc -->
      <label>Chọn mã màu Label:</label>
      <div id="palette" style="margin: 10px 0;"></div>
      
      <input type="text" id="taskTitle" class="input-box" placeholder="Tên công việc...">
      <input type="time" id="taskTime" class="input-box">
      
      <select id="repeatType" class="input-box" onchange="updateUI()">
        <option value="daily">Hàng ngày</option>
        <option value="weekly">Hàng tuần</option>
        <option value="monthly">Hàng tháng</option>
      </select>

      <!-- Options hàng tuần -->
      <div id="weeklyOpt" style="display:none; margin: 10px 0;">
        <label><input type="checkbox" value="1"> T2</label> <label><input type="checkbox" value="2"> T3</label> ...
      </div>

      <button class="btn-add" id="btnAddMain" onclick="addNewTask()">+ Thêm</button>
    </div>
  </div>

  <script>
    // Khôi phục Bảng màu
    const colors = ["#F2C1D1", "#FFD3B6", "#D4F0F0", "#CCE2CB"];
    let selectedColor = colors[0];
    const palette = document.getElementById('palette');
    
    function renderPalette() {
      palette.innerHTML = '';
      colors.forEach(c => {
        const el = document.createElement('div');
        el.className = 'color-swatch' + (c === selectedColor ? ' active' : '');
        el.style.backgroundColor = c;
        el.onclick = () => { selectedColor = c; renderPalette(); };
        palette.appendChild(el);
      });
    }
    renderPalette();

    // Fix lỗi không bấm được nút Thêm
    function addNewTask() {
      const title = document.getElementById('taskTitle').value;
      if (!title) return alert("Vui lòng nhập tên công việc!");
      
      // Thực hiện logic lưu dữ liệu ở đây
      alert("Đã thêm thành công: " + title + " với màu " + selectedColor);
      document.getElementById('taskTitle').value = '';
    }

    function updateUI() {
      const type = document.getElementById('repeatType').value;
      document.getElementById('weeklyOpt').style.display = (type === 'weekly') ? 'block' : 'none';
    }
  </script>
</body>
</html>
