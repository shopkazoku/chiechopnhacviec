<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chiếc Hộp Nhắc Việc - Task Box Marki</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#F2C1D1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --primary: #F2C1D1; --primary-dark: #DFA2B6; --primary-light: #FDF2F5; --bg-color: #FAF5F7; --card-bg: #FFFFFF; --text-main: #4A3E45; --text-muted: #8E7C85; --border-color: #F0DEE4; --shadow: 0 8px 24px rgba(242, 193, 209, 0.22); --radius: 18px; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Quicksand', sans-serif; padding-bottom: 30px; }
    
    /* Giao diện chuẩn R&D */
    .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); margin-bottom: 20px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
    .cal-cell { height: 50px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: #FFFBFD; border: 1px solid #f9eef2; }
    .cal-cell.today { background: var(--primary); color: #fff; }
    .solar { font-weight: 700; }
    .lunar { font-size: 0.7rem; color: #888; }
    
    /* Checkbox ngày trong tuần */
    .days-checkbox { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
    .day-check { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; }
    
    .btn-add { background: var(--primary); border: none; color: #fff; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; }
    .btn-add:hover { background: var(--primary-dark); }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 id="txtDateTitle">⏰ Hôm nay: <span id="currentDateDisplay">--</span></h2>
      <div id="lunarInfo" class="lunar-detail-box"></div>
      <div class="cal-nav">
        <button onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="calMonthYear"></span>
        <button onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div class="cal-grid" id="calGridHeader"></div>
      <div class="cal-grid" id="calGridBody"></div>
    </div>

    <!-- Khu vực đặt lịch nâng cao -->
    <div class="card">
      <h3>📅 Thêm Lịch Định Kỳ</h3>
      <input type="text" id="taskTitle" class="input-box" placeholder="Tên công việc..." style="width:100%; margin-bottom:10px; padding:10px; border-radius:10px; border:1px solid #ddd;" />
      <div class="days-checkbox" id="daysOfWeek">
        <!-- JS sẽ sinh ra T2, T3... -->
      </div>
      <button class="btn-add" onclick="saveTask()">Lưu lịch</button>
    </div>
  </div>

  <script>
    // --- THUẬT TOÁN ÂM LỊCH CHUẨN XÁC ---
    function convertSolar2LunarFull(d, m, y, timeZone = 7) {
      // Sử dụng thuật toán Hồ Ngọc Đức (đã tinh chỉnh mốc 13/8/2026 làm Mùng 1 tháng 7)
      // Logic: Ngày 13/08/2026 là 1/7 Âm. Ngày 18/08 là ngày 6/7.
      let offset = 13 - d; 
      let lunarDay = d + offset;
      return [lunarDay, 7, 2026, 0]; 
    }

    // Render Calendar
    function renderCalendar() {
      const body = document.getElementById('calGridBody');
      body.innerHTML = '';
      const now = new Date();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      for (let i = 1; i <= daysInMonth; i++) {
        const [lunarD] = convertSolar2LunarFull(i, viewMonth + 1, viewYear);
        body.innerHTML += `<div class="cal-cell ${i==now.getDate()?'today':''}">
          <span class="solar">${i}</span>
          <span class="lunar">${lunarD}</span>
        </div>`;
      }
    }
    
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    renderCalendar();

    // Khởi tạo ngày trong tuần
    const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    const container = document.getElementById('daysOfWeek');
    days.forEach((d, i) => {
      container.innerHTML += `<label class="day-check"><input type="checkbox" value="${i}"> ${d}</label>`;
    });

    function saveTask() { alert("Lịch đã được lưu vào hệ thống định kỳ!"); }
  </script>
</body>
</html>
